version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: kindergarden-map-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kindergarden_map
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kindergarden-map-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kindergarden_map?schema=public
      NODE_ENV: production
      PORT: 4000
      MOCK_MODE: 'false'
      API_RATE_LIMIT_MS: '300'
      API_TIMEOUT_MS: '10000'
    command: sh -c "npx prisma db push --schema=./prisma/schema.prisma --accept-data-loss && node dist/src/main"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    container_name: kindergarden-map-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
